# carl's DeepSeek Harness runtime composition.
#
# Booted by `dsh-jsonrpc-agent` (from @deepseek-ai/dsh-sdk-jsonrpc-demo) and
# driven over stdio JSON-RPC by src/dsh-runner.ts. stdout is reserved for
# JSON-RPC frames: no console logger, no terminal UI, no approval prompt.
#
# This is an explicit composition rather than a `~/.dsh` profile over
# `dsh-base`. carl wants a small, versioned, minimal-context tool surface it
# owns, and it wants stdout purity guaranteed by construction rather than by
# hoping no inherited bundle row mounts a stdout logger.
#
# Every value carl varies per run arrives through the environment, because the
# config is loaded once per subprocess and carl spawns one subprocess per skill
# run. See src/dsh-runner.ts for the producing side of this contract.

# ── Entry point ───────────────────────────────────────────────────────────────

# Stdio JSON-RPC server; without it there is no SDK client surface.
- id: sdk-jsonrpc-server
  name: "@deepseek-ai/dsh-sdk-jsonrpc-server"

# ── Agent spine ───────────────────────────────────────────────────────────────

# One bundle plugin carrying the services every agent needs: llm, session,
# tools, system-prompt, agent, agent-loop, tool-bash.
- id: agent-spine
  name: "@deepseek-ai/dsh-agent-spine-demo"
  config:
    # carl's rules plus the skill definition, as the deployment persona. This is
    # the whole point of the SDK integration: an order-0 system-prompt section
    # outranks the AGENTS.md-style guidance a workspace loader would demote it
    # to. Empty would drop the section, so a missing variable is a bug, not a
    # default worth papering over.
    persona: !!js "process.env.CARL_PERSONA ?? ''"

    # carl's rules open with an `[ABSOLUTE — overrides all]` block, and a
    # "You are an AI agent powered by DeepSeek Harness" preamble ahead of it
    # weakens exactly the ordering carl moved to the SDK to obtain. carl also
    # composes its own workspace context into the instruction, so the harness's
    # dynamic snapshots would be a second, differently-worded copy.
    includeHarnessIdentity: false
    includeRuntimeContext: false

    # Code Mode: the model writes one TypeScript program that calls tools as
    # functions instead of emitting a streak of one-tool-per-turn calls.
    #
    # `both`, not `code`, because enforcing the collapse did not produce one.
    # Measured over the 788 programs in ~/.config/carl/events.jsonl: 1.70 tool
    # calls per program, 62% of programs making one call or none, and a 6.0%
    # `run_code` error rate against 0.4% for a direct `read` — four fifths of
    # those failures in programs that made at most one call, so they are
    # authoring mistakes on turns that needed no program at all. The batching
    # `code` was chosen for shows up in a thin tail of real fan-outs, and `both`
    # keeps that tail while letting a one-read turn be one read. The cost is the
    # native tool schemas joining the SDK section in the cached prefix.
    tools:
      mode: both

    # carl composes its own workspace context into the prompt and owns its own
    # skill catalog on disk, so the harness loaders for both would duplicate
    # context carl already pays for.
    workspaceContext: false
    skills:
      enabled: false

    # Background jobs, goal tracking, and the model-facing job controls are all
    # orchestration, and orchestration is the human's job in carl.
    toolJobs: false
    goals: false
    toolBash:
      enableRunInBackground: false

# ── Model routes ──────────────────────────────────────────────────────────────

# Two routes, and carl picks between them per run by resolving the configured
# model name: a locally hosted copy if the local server serves it, Bedrock
# otherwise. Both are declared here because the composition is loaded once per
# subprocess, before carl's chosen provider name reaches the SDK client.
#
# Amazon Bedrock, as a pi-ai catalog route. The catalog pins the us-east-1
# endpoint, so region selection lives there rather than here, and the model id
# is what carl chooses. See BEDROCK_MODEL_IDS for why those ids must be
# `us.`-prefixed inference profiles and why that leaves the cost model unchanged.
#
# A `models` list replaces the catalog's model set, so every model carl uses
# must appear here. All listed models are in the installed catalog; only their
# id is needed.
#
# No credential reference either: SigV4 resolves through the ambient AWS chain,
# so no secret is named here and none needs to be.
- id: llm
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      amazon-bedrock:
        # carl's --effort, mapped to a pi-ai thinking level by REASONING_EFFORT
        # in src/dsh-runner.ts. This is the profile's default level, which pi-ai
        # uses whenever the request names no effort — and carl's never do,
        # because effort is a per-run deployment choice here, not a per-turn one.
        reasoning: !!js "process.env.CARL_REASONING ?? 'medium'"
        # Every model id from BEDROCK_MODEL_IDS in src/dsh-runner.ts. Keep this
        # list in sync with that table: a model id that appears in one but not
        # the other either silently does nothing (extra here) or fails at
        # runtime with UNKNOWN_MODEL (missing here).
        models:
          - id: us.anthropic.claude-sonnet-5
          - id: us.anthropic.claude-sonnet-4-6
          - id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
          - id: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
          - id: us.anthropic.claude-opus-5
          - id: us.anthropic.claude-opus-4-8
          - id: us.anthropic.claude-opus-4-7
          - id: "us.anthropic.claude-opus-4-6-v1"
          - id: "us.anthropic.claude-opus-4-5-20251101-v1:0"
          - id: "us.anthropic.claude-opus-4-1-20250805-v1:0"
          - id: us.anthropic.claude-fable-5

      # A locally hosted, OpenAI-compatible inference server — mtplx by default.
      # carl asks it what it serves before spawning this process and prefers it
      # over Bedrock whenever it can serve the configured model; see
      # createRunner in src/carl.ts.
      #
      # Declared on every run, including Bedrock ones. A hand-declared pi-ai
      # route needs a non-empty `models` list to resolve at all and an
      # unserviceable route fails the whole namespace, so making this one
      # conditional would break Bedrock on any machine with no local server.
      # A Bedrock run therefore leaves CARL_LOCAL_MODEL_ID unset and this route
      # resolves to a model id nothing addresses, which costs one unreachable
      # catalog entry and no requests.
      local:
        api: openai-completions
        baseURL: !!js "process.env.CARL_LOCAL_BASE_URL ?? 'http://localhost:8000/v1'"
        # Named rather than omitted: a profile naming no credential defers to
        # pi-ai's ambient discovery, which has nothing to discover for a
        # hand-declared provider and fails the run with "No API key". carl fills
        # this with a placeholder for the usual local server that ignores the
        # header, and passes a real key through when one is set.
        apiKeyEnv: CARL_LOCAL_API_KEY
        # pi-ai cannot recognize a localhost endpoint, so it addresses it as
        # OpenAI itself: the system prompt as `developer`, the output cap as
        # `max_completion_tokens`. Local servers serving open-weight models
        # reject both, so the request is shaped for Chat Completions as they
        # implement it.
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        # Capacities come from the server's own listing when it discloses them;
        # LOCAL_FALLBACK_* in src/dsh-runner.ts is what these defaults mirror.
        models:
          - id: !!js "process.env.CARL_LOCAL_MODEL_ID ?? 'no-local-model-selected'"
            contextWindow: !!js "Number(process.env.CARL_LOCAL_CONTEXT_WINDOW ?? 32768)"
            maxTokens: !!js "Number(process.env.CARL_LOCAL_MAX_TOKENS ?? 8192)"

# ── Tool backends ─────────────────────────────────────────────────────────────

# Managed child-process groups behind the bash executor.
- id: subprocess
  name: "@deepseek-ai/dsh-subprocess-local"

# The file-effect boundary. carl's read-only skills (review, pr-review) used to
# be enforced by deleting write tools from the request's tool list, which is a
# suggestion the model can only obey — nothing stopped `bash` from running
# `tee`. `read-only` is enforcement, so the skill's contract is now real.
- id: sandbox
  name: "@deepseek-ai/dsh-sandbox-local"

- id: sandbox-policy
  name: "@deepseek-ai/dsh-sandbox-policy"
  config:
    mode: !!js "process.env.CARL_SANDBOX_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.env.CARL_CWD ?? process.cwd()

- id: shell-env
  name: "@deepseek-ai/dsh-shell-env"

- id: bash-sandbox
  name: "@deepseek-ai/dsh-bash-sandbox"
  config:
    timeoutMs: 60000

- id: fs-sandbox
  name: "@deepseek-ai/dsh-fs-sandbox"

# Nothing can answer an approval prompt: carl drives this runtime over JSON-RPC
# with no interactive channel, so `ask` would hang the run forever. carl's
# human-in-the-loop happens at the editor, before and after the run, not
# per tool call — and the sandbox above is what bounds the run's effects.
- id: approval
  name: "@deepseek-ai/dsh-user-approval"
  config:
    policy: never

- id: fs-observation-policy
  name: "@deepseek-ai/dsh-fs-observation-policy"

# read / write / edit — carl's read_file, write_file, str_replace.
- id: tool-fs
  name: "@deepseek-ai/dsh-tool-fs"

# carl's own plugin, and the only row here that is not an installed package: a
# `.`-relative name resolves against this file's directory, and `npm run build`
# emits the bundle. It exists because carl cannot do this from outside — the CLI
# reads notifications after the fact, and `tools/post-execute` is the only seam
# that can change what a tool result says.
#
# 317 of the 2,321 reads in ~/.config/carl/events.jsonl re-read a file the same
# run had already read, and the ledger replaces those lines with a pointer to the
# copy already in the conversation. 14% is a weak average; the case is the tail,
# where the revisit rate reaches 66% in the last fifth of a long run — see
# src/degradation.ts and docs/one-shot.md. `CARL_READ_LEDGER=0` turns it off,
# because a claim about what it saves should be measurable against a run without
# it — and nothing here emits an event, so that A/B is the only way to see it.
- id: read-ledger
  name: "../dist/plugins/read-ledger.mjs"
  config:
    enabled: !!js "process.env.CARL_READ_LEDGER !== '0'"
    minElidedLines: 10

# glob / grep — carl's list_files, find_symbol. A sampled over-cap result reads
# as a complete one, and carl would rather the model see the cap.
- id: tool-fs-search
  name: "@deepseek-ai/dsh-tool-fs-search"
  config:
    sampleOverCapGlobResults: false

# The Code Mode executor. One fresh worker thread per program, empty env.
- id: code-runtime
  name: "@deepseek-ai/dsh-code-runtime-worker-thread"

# ── Session state ─────────────────────────────────────────────────────────────

# Session transcripts live under carl's own config dir, not the workspace. The
# fallback is deliberately outside the repo too, so a misconfigured spawn cannot
# quietly start littering someone's project.
- id: sessions
  name: "@deepseek-ai/dsh-session-persistence-jsonl"
  config:
    root: !!js "process.env.CARL_SESSION_ROOT ?? `${process.env.HOME}/.config/carl/sessions`"

- id: session-checkpoints
  name: "@deepseek-ai/dsh-session-checkpoint-policy"

- id: token-meter
  name: "@deepseek-ai/dsh-token-meter"

# carl's predecessor capped runs at 80 turns and died on context overflow.
# Compaction is a strictly better bound than a turn count.
- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
